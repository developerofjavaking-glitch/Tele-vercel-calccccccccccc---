<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
    }
    h1 {
      margin-bottom: 10px;
    }
    #status {
      font-size: 1.2rem;
      margin-bottom: 20px;
      height: 30px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-gap: 10px;
      justify-content: center;
    }
    .cell {
      width: 90px;
      height: 90px;
      background-color: var(--tg-theme-secondary-bg-color, #232e3c);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .cell.x {
      color: #e53935;
    }
    .cell.o {
      color: #1e88e5;
    }
    button {
      margin-top: 25px;
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #5288c1);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>❌ Tic Tac Toe ⭕</h1>
  <div id="status">প্লেয়ার X এর পালা</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button onclick="resetGame()">নতুন খেলা শুরু করুন</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // পুরো স্ক্রিন জুড়ে ওপেন হওয়ার জন্য

    let currentPlayer = 'X';
    let boardState = Array(9).fill(null);
    let gameActive = true;

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    const statusDisplay = document.getElementById('status');
    const cells = document.querySelectorAll('.cell');

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));

    function handleCellClick(e) {
      const cell = e.target;
      const index = parseInt(cell.getAttribute('data-index'));

      if (boardState[index] !== null || !gameActive) return;

      boardState[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase());

      if (checkWin()) {
        statusDisplay.textContent = `🎉 প্লেয়ার ${currentPlayer} জিতেছে!`;
        gameActive = false;
        tg.HapticFeedback.notificationOccurred('success');
        return;
      }

      if (boardState.every(cell => cell !== null)) {
        statusDisplay.textContent = '🤝 খেলাটি ড্র হয়েছে!';
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusDisplay.textContent = `প্লেয়ার ${currentPlayer} এর পালা`;
      tg.HapticFeedback.selectionChanged();
    }

    function checkWin() {
      return winningConditions.some(condition => {
        return condition.every(index => boardState[index] === currentPlayer);
      });
    }

    function resetGame() {
      currentPlayer = 'X';
      boardState = Array(9).fill(null);
      gameActive = true;
      statusDisplay.textContent = 'প্লেয়ার X এর পালা';
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('x', 'o');
      });
    }
  </script>
</body>
</html>
